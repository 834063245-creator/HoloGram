# CI — 只做两件事：编译 + 测试。格式和 lint 在本地跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: src-ui
      - run: npx tsc --noEmit
        working-directory: src-ui
      - run: npx vite build
        working-directory: src-ui

  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      # Linux: install C/C++ build deps for native crates (usearch, libsqlite3-sys, tree-sitter)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ pkg-config

      - run: cargo test --release
        working-directory: engine
        env:
          RUSTFLAGS: ''
      - run: cargo build --release
        working-directory: engine
        env:
          RUSTFLAGS: ''

  desktop:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - run: npm ci && npx vite build
        working-directory: src-ui
      - run: cargo check --release
        working-directory: src-tauri
