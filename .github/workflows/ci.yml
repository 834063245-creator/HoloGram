name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            src-tauri -> target

      - name: Build & test engine
        working-directory: engine
        run: |
          cargo build --release
          cargo test --release

      - name: Build & test frontend
        working-directory: src-ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify Tauri compiles
        working-directory: src-tauri
        run: npx @tauri-apps/cli@^2 build 2>&1
