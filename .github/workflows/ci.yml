# CI — 编译检查 + 跑测试。不过就不让合。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # Frontend — ubuntu, 最快的，独立跑
  # ═══════════════════════════════════════════════════════════
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: npm test
        working-directory: src-ui

  # ═══════════════════════════════════════════════════════════
  # Rust — windows only (engine tests segfault on Linux, tauri
  # needs engine binary as resource).
  # ═══════════════════════════════════════════════════════════
  rust:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false  # no workspace Cargo.toml at repo root

      # Engine: test + build (binary needed by tauri resource)
      - run: cargo test --release
        working-directory: engine
      - run: cargo build --release
        working-directory: engine

      # Tauri: check (needs engine binary + frontend dist)
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - run: cargo check --release
        working-directory: src-tauri
