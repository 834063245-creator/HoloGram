name: CodeQL

on:
  push:
    branches: [main]

# analyze 步骤需要上传 SARIF 到 code-scanning API——默认 GITHUB_TOKEN 无权，
# 显式授权（否则分析成功也挂在 "Resource not accessible by integration"）。
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
