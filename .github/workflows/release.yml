# 打 v* tag 自动发版。
#   engine-cli: 双平台 engine 二进制 + CLI 安装脚本
#   desktop:    Windows 桌面应用 (MSI)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  engine-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hologram-engine-linux-x64
            bin: hologram-engine
          - os: windows-latest
            artifact: hologram-engine-windows-x64
            bin: hologram-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ pkg-config

      - name: Build engine
        run: cargo build --release
        working-directory: engine

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp engine/target/release/hologram-engine staging/
          cp release-bin/hologram staging/
          cp release-bin/install.sh staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp engine/target/release/hologram-engine.exe staging/
          cp release-bin/hologram.cmd staging/
          cp release-bin/hologram staging/
          cp release-bin/install.cmd staging/
          cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip .

      - name: Generate changelog
        shell: bash
        run: git cliff --latest > /tmp/changelog.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - run: npm ci && npm run build
        working-directory: src-ui
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Generate changelog
        id: cliff
        shell: bash
        run: |
          {
            echo 'changelog<<CLIFF_EOF'
            git cliff --latest
            echo CLIFF_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.cliff.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config '{"build":{"beforeBuildCommand":""}}'
