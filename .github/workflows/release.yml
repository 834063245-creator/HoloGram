# 打 v* tag 自动发版。
#   engine-cli: 双平台 engine 二进制 + CLI 安装脚本
#   desktop:    Windows 桌面应用 (MSI)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  engine-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hologram-engine-linux-x64
            bin: hologram-engine
          - os: windows-latest
            artifact: hologram-engine-windows-x64
            bin: hologram-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ pkg-config

      - name: Build engine
        run: cargo build --release
        working-directory: engine

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp engine/target/release/hologram-engine staging/
          cp release-bin/hologram staging/
          cp release-bin/install.sh staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp engine/target/release/hologram-engine.exe staging/
          cp release-bin/hologram.cmd staging/
          cp release-bin/hologram staging/
          cp release-bin/install.cmd staging/
          cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip .

      - name: Generate changelog
        shell: bash
        run: git cliff --current > /tmp/changelog.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  dsh-bundle:
    # hologram-dsh npm 包：构建引擎二进制传 Release + 自动 npm publish
    # 版本跟随主版本线：tag v<version> → npm 发 <version>（install.mjs 按版本从 Release 下载二进制）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build engine (release)
        run: cargo build --release
        working-directory: engine

      - name: Stage engine binary for dsh-bundle
        shell: bash
        run: |
          mkdir -p staging
          cp engine/target/release/hologram-engine.exe staging/hologram-engine-win32-x64.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/hologram-engine-win32-x64.exe

      - name: Install plugin build deps
        working-directory: dsh-bundle
        run: npm ci || npm install --no-audit --no-fund

      - name: Build host plugin
        working-directory: dsh-bundle
        run: npx tsdown --config tsdown.config.ts

      - name: Build client plugin
        working-directory: dsh-bundle
        run: npx tsdown --config tsdown.client.config.ts

      - name: Install viewer build deps (src-ui)
        working-directory: src-ui
        run: npm ci || npm install --no-audit --no-fund

      - name: Build viewer
        shell: bash
        working-directory: dsh-bundle/viewer
        run: node ../../src-ui/node_modules/vite/bin/vite.js build

      - name: Align package version to tag
        shell: bash
        working-directory: dsh-bundle
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VER"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$VER"

      - name: Publish to npm
        working-directory: dsh-bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - run: npm ci && npm run build
        working-directory: src-ui
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # model.onnx（90MB）不入库（.gitignore），但打包要求 tauri.conf.json resources 路径存在。
      - name: Download MiniLM ONNX model
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          f=models/all-MiniLM-L6-v2/model.onnx
          curl -fL --retry 3 -o "$f" \
            https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          echo "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452 *$f" | sha256sum -c -

      - name: Generate changelog
        id: cliff
        shell: bash
        run: |
          {
            echo 'changelog<<CLIFF_EOF'
            git cliff --current
            echo CLIFF_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.cliff.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config '{"build":{"beforeBuildCommand":""}}'

