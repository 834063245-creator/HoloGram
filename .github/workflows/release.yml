name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            src-tauri -> target

      - name: Build & test engine
        run: |
          cd engine
          cargo build --release
          cargo test --release

      - name: Build & test frontend
        run: |
          cd src-ui
          npm ci
          npm run build
          npm test

      - name: Build Tauri app (MSI bundle)
        run: |
          cd src-tauri
          npx @tauri-apps/cli@^2 build --ci

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            engine/target/release/hologram-engine.exe
