# 打 v* tag 自动发版。
#   engine-cli: 双平台 engine 二进制 + CLI 安装脚本
#   desktop:    Windows 桌面应用（NSIS setup.exe；2026-09-26 起只发 NSIS、不再出 .msi，
#               见 src-tauri/tauri.windows.conf.json 的 bundle.targets 与
#               docs/plans/uninstall-purge-plan.md）
#
# ⚠ 自动更新的两根命脉（2026-09-22 修复，两者曾同时断掉）：
#   1. `src-tauri/tauri.conf.json` 的 `bundle.createUpdaterArtifacts` **必须为 true**，
#      否则 tauri-action 不产出 `.sig` 与 `latest.json` —— 应用内更新会静默失效（不报错，
#      就是不更新）。该开关 2026-08-25 曾因「本地构建不再要 updater 签名密码」被置为 false，
#      但它是**全局**的，把发版一起关了；现改为：conf 恒 true（发版态），本地构建由 build.cmd
#      以 `--config src-tauri/no-updater.local.json` 覆盖（本地无签名密码，也不需要 updater 产物）。
#   2. updater 端点（tauri.conf.json `plugins.updater.endpoints`）的**仓库名必须真实存在**：
#      2026-09 改名曾写成 `/Lantai/`（该仓库不存在）⇒ 端点 404。正确为 `/LantaiAgent/`。
#      2026-09-26 起 `endpoints` 是**数组**：首位是 Gitee 上的国内更新清单，GitHub 退为兜底。
#      **国内那份清单不由本工作流产出**：实测美国 runner 往国内主传大文件只有 29KB/s
#      （4 次重试一致，属系统性），所以国内分发改为「本机构建+签名 →
#      scripts/release-local.mjs 上传 GitCode + 推 Gitee 清单」。本工作流只负责 GitHub
#      侧的正式发布（海外用户 + 备份），两边都用同一把新密钥签名，因此可以并存。
#
# 签名密钥注意：升级签名的私钥密码若已遗失，**不要**贸然重新生成密钥对——已安装的旧客户端
# 内嵌的是旧 pubkey，用新密钥签名会导致旧客户端校验失败（用户须手动重装一次）。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  engine-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hologram-engine-linux-x64
            bin: hologram-engine
          - os: windows-latest
            artifact: hologram-engine-windows-x64
            bin: hologram-engine.exe
          # 2026-09 add：macOS 腿。`macos-latest` 现为 Apple Silicon（arm64），
          # 覆盖绝大多数 Mac 用户；Intel Mac 用户需 Rosetta 转译或自行从源码构建，
          # 见 README「引擎 CLI」的平台说明。产出的后缀是 .dylib——
          # grammar_loader 的平台后缀真源已是 native_shared_lib_exts()，
          # 三平台产物后缀与扫描两侧自此同源（v8 契约修复）。
          - os: macos-latest
            artifact: hologram-engine-macos-arm64
            bin: hologram-engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential g++ pkg-config

      # 产物落点：仓库根 `target/release/`，**不是** `engine/target/`——根 Cargo.toml 是工作区
      # （members = engine/src-tauri/hologram-{graph,storage,vector}，2026-09-08 L5b crate 拆出时立的），
      # 从成员目录跑 cargo 一样写工作区根 target。原写法 `cd engine && cargo build` + 从
      # `engine/target/...` 取件，自那次改造起就必然 `cp: No such file or directory`。
      - name: Build engine
        run: cargo build --release -p hologram-engine

      # 动态语法（kotlin / markdown / toml）不在静态注册表里——engine/grammar.rs
      # 静态注册的 26 个语言之外，这三个靠 grammars/ 目录下的共享库惰性加载。
      # 此前发版只 stage 裸二进制，grammars/ 从未进过任何 Release 产物，于是
      # **三平台一致地**退化为「无这三个语法」：不报错、只降解析质量（Windows
      # 本地开发有 engine/grammars/*.dll 所以看不出，Release 用户才中招）。
      # 这里按平台现编现打，随产物一起发。
      #
      # 语法源码来源（与 engine/grammars/grammars.txt 同源，均为 MIT）：
      #   https://github.com/tree-sitter-grammars/tree-sitter-{kotlin,markdown,toml}
      # 各平台工具链：Linux/macOS 用系统 cc/cc+（macOS runner 自带 clang，
      # clang 可直接吃 -fPIC -shared 产出 .dylib）；Windows 用 runner 预装的
      # mingw64 gcc（build.ps1 已带 -static-libgcc -static-libstdc++，
      # 避免产物依赖 mingw 运行库）。
      - name: Build dynamic grammars (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: engine/grammars
        # 显式 `bash` 调用，**不依赖 checkout 出来的可执行位**：本仓主力开发机是
        # Windows（core.fileMode=false），build.sh 的 +x 只活在索引里，从 Windows
        # 侧重新入库一次就会静默抹掉它。2026-09-24 v1.0.2 的 ubuntu / macOS 两腿
        # 就是整轮红在 `./build.sh: Permission denied`（exit 126）上的——而这一步
        # 之前没有任何一步失败，Windows 腿因为走 build.ps1 完全无感。
        run: bash ./build.sh --all
      - name: Build dynamic grammars (Windows)
        if: runner.os == 'Windows'
        working-directory: engine/grammars
        shell: pwsh
        run: ./build.ps1 -All

      # 2026-09-16：release-bin/（`hologram` wrapper + install.cmd/install.sh）已删除——
      # 引擎包只发裸二进制，用法见 README「引擎 CLI」。B3 收口，见 docs/landmine-map.md。
      #
      # grammar_loader::find_grammar_dir 的查找顺序里，第 2 位就是
      # <exe_dir>/grammars/——所以语法库必须铺在**二进制同级**的 grammars/ 下。
      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging/grammars
          cp target/release/hologram-engine staging/
          cp engine/grammars/tree-sitter-*.so staging/grammars/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .
      - name: Stage artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging/grammars
          cp target/release/hologram-engine staging/
          cp engine/grammars/tree-sitter-*.dylib staging/grammars/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging/grammars
          cp target/release/hologram-engine.exe staging/
          cp engine/grammars/tree-sitter-*.dll staging/grammars/
          cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip .

      # 构建产物自检：语法库必须真的编出来了，且**符号对得上**。
      # 少了它，「build.ps1 静默没编出东西」会一路滑到用户侧才以「解析质量下降」
      # 的形式暴露——那是最难归因的一类失败，所以在发版这一步就钉死。
      - name: Verify grammar artifacts
        shell: bash
        run: |
          expected=$(grep -v '^#' engine/grammars/grammars.txt | grep -v '^[[:space:]]*$' | wc -l | tr -d ' ')
          case "${{ runner.os }}" in
            Windows) ext=dll ;;
            macOS)   ext=dylib ;;
            *)       ext=so ;;
          esac
          actual=$(ls -1 engine/grammars/tree-sitter-*.$ext 2>/dev/null | wc -l | tr -d ' ')
          echo "grammars.txt 声明 $expected 个，实际产出 $actual 个 .$ext"
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::动态语法产物缺失（期望 $expected 个 .$ext，实得 $actual）"
            exit 1
          fi

          # 数量够 ≠ 能用（2026-09-24 实测）：引擎按**文件名**反推符号名
          # （grammar_loader：`tree_sitter_{grammar}`，'-'→'_'），找不符号只留一行
          # 日志、纯退化不报错。而 markdown 的 monorepo 里有 block / inline 两个
          # 语法，inline 导出的是 `tree_sitter_markdown_inline`，产物文件名却一样
          # 叫 tree-sitter-markdown.<ext> ⇒ 上面那条数量检查照样全绿，用户侧
          # markdown 却永远加载不上。故这里按同样的规则逐库验符号。
          # nm 缺失时只告警跳过——不拿工具缺席判红。
          if command -v nm >/dev/null 2>&1; then
            for lib in engine/grammars/tree-sitter-*.$ext; do
              lang=$(basename "$lib" ".$ext" | sed 's/^tree-sitter-//')
              sym=tree_sitter_$(echo "$lang" | tr '-' '_')
              if ! nm -g "$lib" 2>/dev/null | grep -qE "(^|[^a-zA-Z0-9])${sym}$"; then
                echo "::error::$lib 未定义符号 $sym —— 该语法库引擎加载不上（静默退化）"
                exit 1
              fi
              echo "  符号 OK: $sym  ←  $lib"
            done
          else
            echo "::warning::nm 不可用，跳过语法符号自检"
          fi

      # 为什么不用 `git cliff --current`（2026-09-22 实测翻案）：
      # `--current` 内部要拿「HEAD 上那个 tag」在 git-cliff 自己的 tags 表里的下标再 `index-1`
      # （git-cliff-core：`current_tag_index.checked_sub(1)`，None 即 ChangelogError
      # "No suitable tags found"）。而 cliff.toml 开了 `topo_order = true`，此时 git-cliff
      # **不按时间排序**，tags 顺序 = libgit2 列 refs 的顺序 —— 松散 ref 排在打包 ref 之前。
      # 于是成败全看「HEAD 那个 tag 是以什么形态存的」：
      #   · 本仓实测：v1.0.0 是刚打的松散 ref ⇒ 落成 index 0 ⇒ 下溢 ⇒ 8/8 全红；
      #   · 全打包 ref 的新克隆 ⇒ 5/5 通过（同一份 tag 集合、两种结果）。
      # 换句话说它能不能过取决于 ref 存储形态（本地/CI、git 版本、fetch 行为都会影响），
      # 不能拿发版去赌。显式范围只认版本拓扑，实测 5/5 稳定。
      - name: Generate changelog
        shell: bash
        run: |
          if PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"   # 没有上一个 tag（首版）⇒ 整段历史
          fi
          echo "changelog range: ${RANGE}"
          git cliff "${RANGE}" --tag "${GITHUB_REF_NAME}" --offline > /tmp/changelog.md

      # 只上传 workflow artifact，**不碰 release**：四腿各自去更新同一个 release 会倒在
      # "Resource not accessible by integration"（2026-09-26 实测，四腿全红）。
      # 资产统一由收尾的 attach-assets 腿串行 `gh release upload`（见文件末）。
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 3

  dsh-bundle:
    # hologram-dsh npm 包：构建引擎二进制传 Release + 自动 npm publish
    # 版本跟随主版本线：tag v<version> → npm 发 <version>（install.mjs 按版本从 Release 下载二进制）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build engine (release)
        run: cargo build --release -p hologram-engine

      - name: Stage engine binary for dsh-bundle
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/hologram-engine.exe staging/hologram-engine-win32-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hologram-engine-win32-x64
          path: staging/hologram-engine-win32-x64.exe
          retention-days: 3

      # npm ci 会跑 postinstall（scripts/install.mjs）——它按版本从 GitHub Release 下载引擎二进制。
      # 而本文件末尾的 attach-assets 腿才是挂资产的地方（各腿不再自己写 release），
      # 这一刻 release 上还没有这个附件 ⇒ 先把刚构建好的引擎放进 bundle 的 bin/
      # （install.mjs 见到该文件就跳过下载）。发布内容不受影响：package.json 的 files 不含 bin/，
      # 用户装包时仍从 Release 取二进制。
      - name: Pre-place engine binary for the postinstall step
        shell: bash
        run: |
          mkdir -p dsh-bundle/bin
          cp target/release/hologram-engine.exe dsh-bundle/bin/hologram-engine.exe

      - name: Install plugin build deps
        working-directory: dsh-bundle
        run: npm ci || npm install --no-audit --no-fund

      - name: Build host plugin
        working-directory: dsh-bundle
        run: npx tsdown --config tsdown.config.ts

      - name: Align package version to tag
        shell: bash
        working-directory: dsh-bundle
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VER"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$VER"

      # 幂等：npm 不允许覆盖已发布的版本号，所以「重跑一次发版」时这一步必然红
      # （`npm publish` → E403 "You cannot publish over the previously published versions"）。
      # 而重跑恰恰是发版失败后的标准恢复动作——不该因为「已经发过了」把整轮判红。
      # 已存在即跳过（内容本来也改不了：同版本同产物）。
      - name: Publish to npm (skip if this version already exists)
        working-directory: dsh-bundle
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@a834063245/hologram-dsh@$VER" version >/dev/null 2>&1; then
            echo "npm 上已有 @a834063245/hologram-dsh@$VER —— 跳过发布"
          else
            npm publish --access public
          fi

  desktop:
    runs-on: windows-latest
    # 45 分钟，不是 30：本 job 现在**多了一次冷编引擎**（bundle.resources 要那枚二进制，
    # 见下面 "Build engine binary" 一步）。v10.4.0 实测本 job 17m51s / 30m 预算，当时
    # 并不编引擎；同一 runner 上冷编 engine 的实测开销 ≈ 6m（见 engine-cli 的 windows 腿）。
    # 加起来 ≈ 24m——卡在 30m 预算的 80%，而 GH runner 的方差足以让它偶发超时，
    # 超时一次就废掉整轮发版（Release 已被部分创建）。留出行李。
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff needs full history to build changelog

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - run: npm ci && npm run build
        working-directory: src-ui
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # model.onnx（90MB）不入库（.gitignore），但打包要求 tauri.conf.json resources 路径存在。
      # 引擎资产归位（engine-host-severance，2026-09-08）：模型目录在 engine/models/。
      - name: Download MiniLM ONNX model
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          f=models/all-MiniLM-L6-v2/model.onnx
          curl -fL --retry 3 -o "$f" \
            https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          echo "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452 *$f" | sha256sum -c -

      # 随包件：office 域工具的后端二进制（不入 git，打包期取件——见 scripts/fetch-officecli.mjs）。
      # 缺它 ⇒ tauri 的 build script 在资源校验阶段即失败（`resource path bin/officecli.exe
      # doesn't exist`），整个打包无从谈起。pin 版本 + SHA256 校验，落点 src-tauri/bin/。
      - name: Fetch bundled OfficeCLI binary
        shell: bash
        run: node scripts/fetch-officecli.mjs

      # 上游新版提醒（**非致命**，continue-on-error）：pin 住版本是对的（哈希校验才有意义、
      # 上游改 CLI 不会打到用户），但副作用是「该升级了」没有任何信号。这一步补上信号——
      # 只提示、不改 pin、不阻断发版；查不到（离线/限流）也静默跳过。
      - name: Check upstream OfficeCLI version (advisory)
        shell: bash
        continue-on-error: true
        run: node scripts/fetch-officecli.mjs --upstream

      # 引擎二进制本身也是 bundle.resources 的一员（tauri.conf.json 首条：
      # `"../target/release/hologram-engine.exe": "hologram-engine.exe"`），而 tauri 的 build script
      # 对 resources 每一条做**编译期存在性校验**——缺它 = 整个打包在编译阶段就失败（不是打包后缺件）。
      # ⚠ 别指望配置里的 beforeBuildCommand 兜底：下面 tauri-action 的 args 把它**覆盖成空**
      # （`--config '{"build":{"beforeBuildCommand":""}}'`，本意是免得前端构建跑两遍），
      # 而那份被覆盖掉的脚本里恰好带着 `cargo build -p hologram-engine --release`。所以这里必须显式补。
      - name: Build engine binary (bundle resource)
        run: cargo build --release -p hologram-engine

      - name: Generate changelog
        id: cliff
        shell: bash
        run: |
          if PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"   # 没有上一个 tag（首版）⇒ 整段历史
          fi
          echo "changelog range: ${RANGE}"
          {
            echo 'changelog<<CLIFF_EOF'
            git cliff "${RANGE}" --tag "${GITHUB_REF_NAME}" --offline
            echo CLIFF_EOF
          } >> "$GITHUB_OUTPUT"

      # Windows Authenticode 签名（可选，默认关）——只有在配了签名 secret 时，才把签名配置
      # 写进 tauri.windows.conf.json，并让 scripts\sign-windows.cmd 能被裸名字找到。
      #   未配 secret ⇒ 本步整段跳过 ⇒ Tauri 的 can_sign() 为假 ⇒ 发版行为与从前逐字一致
      #   （runner 上的 Windows SDK 只在真签名时才被用到：bundler 签 bundle.resources 前要先
      #    跑一次 `signtool verify` 探「是否已签名」，见 tauri-bundler sign.rs: should_sign）。
      # 证书三选一：LANTAI_SIGN_PFX_BASE64(+_PASSWORD) / LANTAI_SIGN_THUMBPRINT / LANTAI_SIGN_COMMAND。
      # 细节与本地侧同一份说明：scripts/sign-windows.ps1 头注 + CONTRIBUTING.md「Windows 代码签名」。
      - name: Enable Windows code signing (no-op unless signing secrets exist)
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.LANTAI_SIGN_PFX_BASE64 }}
          SIGN_PFX_PWD: ${{ secrets.LANTAI_SIGN_PFX_PASSWORD }}
          SIGN_THUMB: ${{ secrets.LANTAI_SIGN_THUMBPRINT }}
          SIGN_CMD: ${{ secrets.LANTAI_SIGN_COMMAND }}
        run: |
          if (-not ($env:SIGN_PFX_B64 -or $env:SIGN_THUMB -or $env:SIGN_CMD)) {
            Write-Host 'No Windows signing secrets configured - build stays unsigned (same as before).'
            exit 0
          }
          $confPath = 'src-tauri/tauri.windows.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $conf.build) { $conf | Add-Member -NotePropertyName build -NotePropertyValue ([pscustomobject]@{}) -Force }
          $conf.build | Add-Member -NotePropertyName beforeBundleCommand -NotePropertyValue 'sign-windows.cmd' -Force
          if (-not $conf.bundle.windows) { $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force }
          $signCommand = [pscustomobject]@{ cmd = 'cmd.exe'; args = @('/c', 'sign-windows.cmd', '%1') }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCommand -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath
          Add-Content $env:GITHUB_PATH (Join-Path $env:GITHUB_WORKSPACE 'scripts')
          if ($env:SIGN_PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'lantai-code-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            Add-Content $env:GITHUB_ENV "LANTAI_SIGN_PFX=$pfx"
            Add-Content $env:GITHUB_ENV "LANTAI_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PWD"
          }
          if ($env:SIGN_THUMB) { Add-Content $env:GITHUB_ENV "LANTAI_SIGN_THUMBPRINT=$env:SIGN_THUMB" }
          if ($env:SIGN_CMD) { Add-Content $env:GITHUB_ENV "LANTAI_SIGN_COMMAND=$env:SIGN_CMD" }
          Write-Host 'Windows code signing enabled for this run.'

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.cliff.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config '{"build":{"beforeBuildCommand":""}}'

  attach-assets:
    # 收尾腿：把各腿的产物串行挂到 release 上。
    #
    # 为什么拆出来（2026-09-26 实测两次）：engine-cli 三腿 + dsh 腿原先各自用
    # softprops/action-gh-release@v2 去更新同一个 release，四腿**全部**倒在
    # `Resource not accessible by integration`（rest/releases#update-a-release）——
    # 那条路要先 PATCH release 元数据，多腿并发改同一份 release 走不通。
    # 现在各腿只传 workflow artifact，这里一次性 `gh release upload`（只碰资产）。
    # release 本体（标题 / changelog 正文 / 签名产物 / latest.json）由 desktop 腿的
    # tauri-action 建，所以这一腿排在它之后。
    needs: [engine-cli, dsh-bundle, desktop]
    # always()：引擎资产是主线交付物，不能因为 dsh 腿红就整条跳过（那正是 2026-09-26
    # run #170 的形态：三腿绿、dsh 红 ⇒ attach 被 skip、引擎包一个都没挂上）。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach engine binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          # 本腿没有 checkout，gh 认不出仓库 ⇒ 显式 --repo
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

