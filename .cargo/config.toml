# MinGW toolchain: use gcc-wrap to inject static -lstdc++ BEFORE rustc's
# dynamic -lstdc++ (the -static-libstdc++ driver flag alone can't override
# -Wl,-Bdynamic -lstdc++ that rustc hardcodes in its target spec).
[target.x86_64-pc-windows-gnu]
linker = "D:\\HoloGramHG\\grammars\\gcc-wrap.exe"
rustflags = ["-C", "link-args=-static-libgcc"]

# sccache — shared compilation cache for parallel worktrees.
# Each worktree has its own target/ (no file-lock contention), but
# compilation results are cached by content hash. The first build
# warms the cache; subsequent worktrees hit it instantly.
[build]
rustc-wrapper = "sccache"
