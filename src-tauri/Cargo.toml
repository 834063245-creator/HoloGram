[package]
name = "lantai"
version = "1.0.7"
description = "兰台"
authors = ["Lantai Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [], default-features = false }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ignore = "0.4"
ureq = "3"
regex = "1"
encoding_rs = "0.8"
glob = "0.3"
url = "2"
portable-pty = "0.9"
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt", "rt-multi-thread", "macros", "io-std"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "http2"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
http-body = "1"
libloading = "0.9"
tracing = "0.1"
# 启动期诊断日志门面（boot_log.rs）：tauri/wry/tao/webview2-com 的失败只走 log::error!，
# 不装 logger 就是静默。见 boot_log.rs 头注（2026-10-07 事故立法）。
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
base64 = "0.22"
# 工具附图通道 P0a（docs/plans/tool-image-context-plan.md）：截图转存工作区
# attachments 时按内容寻址命名（id = 字节 sha256，与 INVARIANTS #14 同义）。
# 版本与 Cargo.lock 里既有的传递依赖同版（tauri-codegen / wry 已带），不引入新下载。
sha2 = "0.10"
# S4-3 插件安装通道：npm tarball 解包（纯解包，无传递风险——tar-slip 防护手写）
tar = "0.4"
flate2 = "1"
# 引擎-宿主逻辑全断（engine-host-severance，2026-09-08）：
# hologram-graph/storage/vector 三条 path 依赖全摘——引擎 = 独立子进程
# （hologram-engine.exe，stdio MCP），壳零 crate 直连（守卫测试
# shell_has_zero_hologram_crate_refs 钉死）。
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# UIA 进程内 COM 客户端（desktop_uia_*）+ 物理输入合成（SendInput/剪贴板）
windows = { version = "0.61", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    # window_drag_band（拖动带夹紧）：SetWindowSubclass / DefSubclassProc
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    # 进程完整性自检（integrity.rs，2026-10-15 事故立法）：
    # OpenProcessToken / GetTokenInformation(TokenIntegrityLevel) / GetCurrentProcess
    "Win32_Security",
    "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
